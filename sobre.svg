<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102D55"/>
      <stop offset="100%" stop-color="#1A3A66"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E6C757"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky2)"/>
  <!-- shanghai-style skyline silhouette -->
  <g fill="#0B1E3A" opacity="0.95">
    <rect x="40" y="600" width="60" height="320"/>
    <rect x="100" y="540" width="50" height="380"/>
    <rect x="150" y="650" width="80" height="270"/>
    <polygon points="230,400 270,400 290,920 210,920"/>
    <rect x="290" y="500" width="60" height="420"/>
    <rect x="350" y="580" width="70" height="340"/>
    <polygon points="420,300 460,300 470,920 410,920"/>
    <rect x="470" y="460" width="80" height="460"/>
    <rect x="550" y="560" width="60" height="360"/>
    <rect x="610" y="500" width="70" height="420"/>
    <rect x="680" y="620" width="80" height="300"/>
  </g>
  <!-- building windows highlights -->
  <g fill="#D4AF37" opacity="0.25">
    <rect x="50" y="650" width="6" height="6"/><rect x="70" y="650" width="6" height="6"/>
    <rect x="50" y="700" width="6" height="6"/><rect x="70" y="700" width="6" height="6"/>
    <rect x="115" y="600" width="6" height="6"/><rect x="135" y="600" width="6" height="6"/>
    <rect x="240" y="450" width="6" height="6"/><rect x="240" y="500" width="6" height="6"/>
    <rect x="490" y="510" width="6" height="6"/><rect x="510" y="510" width="6" height="6"/>
    <rect x="490" y="560" width="6" height="6"/><rect x="510" y="560" width="6" height="6"/>
    <rect x="630" y="540" width="6" height="6"/><rect x="630" y="600" width="6" height="6"/>
  </g>
  <!-- water reflection -->
  <rect x="0" y="920" width="800" height="80" fill="#061528"/>
  <g fill="#D4AF37" opacity="0.08">
    <rect x="50" y="940" width="80" height="2"/>
    <rect x="220" y="950" width="60" height="2"/>
    <rect x="380" y="945" width="100" height="2"/>
    <rect x="560" y="955" width="70" height="2"/>
  </g>
  <!-- chinese character 飞 (fei) decorative -->
  <text x="120" y="200" font-family="serif" font-size="180" font-weight="bold" fill="#D4AF37" opacity="0.18">飞鸿</text>
  <!-- gold accent line -->
  <line x1="40" y1="950" x2="200" y2="950" stroke="url(#goldStroke)" stroke-width="3"/>
  <text x="40" y="985" font-family="Arial,sans-serif" font-size="14" fill="#D4AF37" opacity="0.55">PLACEHOLDER — substitua por foto real</text>
</svg>
