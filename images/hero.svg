<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2447"/>
      <stop offset="60%" stop-color="#102D55"/>
      <stop offset="100%" stop-color="#1A3A66"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2A4D"/>
      <stop offset="100%" stop-color="#061528"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="700" fill="url(#sky)"/>
  <rect y="700" width="1920" height="380" fill="url(#water)"/>
  <!-- distant skyline -->
  <g fill="#0B1E3A" opacity="0.85">
    <rect x="0" y="540" width="80" height="160"/>
    <rect x="80" y="500" width="60" height="200"/>
    <rect x="140" y="560" width="70" height="140"/>
    <rect x="210" y="470" width="50" height="230"/>
    <rect x="260" y="520" width="80" height="180"/>
    <rect x="340" y="490" width="60" height="210"/>
    <rect x="400" y="540" width="90" height="160"/>
    <rect x="490" y="510" width="70" height="190"/>
    <rect x="1400" y="540" width="80" height="160"/>
    <rect x="1480" y="500" width="60" height="200"/>
    <rect x="1540" y="560" width="70" height="140"/>
    <rect x="1610" y="480" width="60" height="220"/>
    <rect x="1670" y="530" width="80" height="170"/>
    <rect x="1750" y="510" width="60" height="190"/>
    <rect x="1810" y="550" width="100" height="150"/>
  </g>
  <!-- containers -->
  <g>
    <rect x="700" y="640" width="160" height="60" fill="#8B2E2E"/>
    <rect x="700" y="700" width="160" height="60" fill="#2E5F8B"/>
    <rect x="860" y="640" width="160" height="60" fill="#3D7A4F"/>
    <rect x="860" y="700" width="160" height="60" fill="#8B6B2E"/>
    <rect x="1020" y="640" width="160" height="60" fill="#2E5F8B"/>
    <rect x="1020" y="700" width="160" height="60" fill="#8B2E2E"/>
    <g stroke="#000" stroke-width="1" opacity="0.3" fill="none">
      <line x1="700" y1="670" x2="1180" y2="670"/>
      <line x1="700" y1="730" x2="1180" y2="730"/>
    </g>
  </g>
  <!-- crane silhouette -->
  <g stroke="#0B1E3A" stroke-width="6" fill="none" opacity="0.9">
    <line x1="560" y1="760" x2="560" y2="300"/>
    <line x1="560" y1="300" x2="1080" y2="280"/>
    <line x1="560" y1="320" x2="1060" y2="300"/>
    <line x1="780" y1="295" x2="780" y2="500"/>
  </g>
  <!-- gold accent reflections -->
  <g opacity="0.15" fill="#D4AF37">
    <circle cx="1500" cy="200" r="60"/>
  </g>
  <!-- watermark text -->
  <text x="960" y="1020" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#D4AF37" opacity="0.5">PLACEHOLDER — substitua por foto real em images/hero.jpg</text>
</svg>
