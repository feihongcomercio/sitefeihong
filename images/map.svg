<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <!-- stylized China-Brazil connection with dotted route -->
  <g fill="#D4AF37" opacity="0.25">
    <!-- China region (right) -->
    <path d="M850 180 Q900 160 940 180 Q980 200 990 240 Q1000 290 970 320 Q920 340 880 320 Q840 300 830 260 Q825 210 850 180 Z"/>
    <!-- Brazil region (left) -->
    <path d="M260 280 Q300 250 340 270 Q400 290 420 350 Q430 410 400 460 Q360 500 310 480 Q260 460 240 410 Q230 350 260 280 Z"/>
  </g>
  <!-- dotted connection arc -->
  <path d="M 380 340 Q 600 80 880 250" stroke="#D4AF37" stroke-width="2" fill="none" stroke-dasharray="4 8" opacity="0.5"/>
  <!-- endpoints -->
  <circle cx="380" cy="340" r="8" fill="#D4AF37"/>
  <circle cx="880" cy="250" r="8" fill="#D4AF37"/>
  <circle cx="380" cy="340" r="16" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  <circle cx="880" cy="250" r="16" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  <!-- labels -->
  <text x="380" y="380" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="14" font-weight="700" fill="#D4AF37" letter-spacing="2" opacity="0.7">BRASIL</text>
  <text x="880" y="290" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="14" font-weight="700" fill="#D4AF37" letter-spacing="2" opacity="0.7">CHINA</text>
  <!-- subtle grid -->
  <g stroke="#D4AF37" stroke-width="0.5" opacity="0.08" fill="none">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>
</svg>
